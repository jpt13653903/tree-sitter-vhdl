[package]
authors = [ "John-Philip Taylor" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "VHDL grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "vhdl" ]
license = "MIT"
name = "tree-sitter-vhdl"
readme = "README.md"
repository = "https://github.com/jpt13653903/tree-sitter-vhdl"
version = "2.0.1"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
